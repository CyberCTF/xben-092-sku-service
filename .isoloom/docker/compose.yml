name: xben-092-sku-service
services:
  web:
    build:
      context: ../../build/web
      labels:
        isoloom.managed: 'true'
        isoloom.environment: xben-092-sku-service
    image: isoloom/xben-092-sku-service-web
    platform: linux/amd64
    hostname: web
    networks:
      lab:
        ipv4_address: 10.61.135.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8081}:8081
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8081
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:8081
      isoloom.managed: 'true'
      isoloom.environment: xben-092-sku-service
    restart: unless-stopped
  web-routes:
    image: alpine:3.20
    network_mode: service:web
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: xben-092-sku-service
  skumodel:
    build:
      context: ../../build/skumodel
      labels:
        isoloom.managed: 'true'
        isoloom.environment: xben-092-sku-service
    image: isoloom/xben-092-sku-service-skumodel
    platform: linux/amd64
    hostname: skumodel
    networks:
      lab:
        ipv4_address: 10.61.135.20
    environment:
      CTF_FLAG_MAIN: ${CTF_FLAG_MAIN:-}
    volumes:
    - skumodel-ctf:/ctf
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 4455
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:4455
      isoloom.managed: 'true'
      isoloom.environment: xben-092-sku-service
    restart: unless-stopped
  skumodel-routes:
    image: alpine:3.20
    network_mode: service:skumodel
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      skumodel:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: xben-092-sku-service
  skumodel-init-1:
    image: isoloom/xben-092-sku-service-skumodel
    entrypoint:
    - /bin/sh
    - /isoloom/init/flag.sh
    volumes:
    - ../../ctf/flag.sh:/isoloom/init/flag.sh:ro
    - skumodel-ctf:/ctf
    network_mode: service:skumodel
    environment:
      CTF_FLAG_MAIN: ${CTF_FLAG_MAIN:-}
    depends_on:
      skumodel:
        condition: service_healthy
      skumodel-routes:
        condition: service_healthy
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: xben-092-sku-service
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
