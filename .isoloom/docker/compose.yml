    network_mode: service:web
    depends_on:
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
      skumodel:
        condition: service_healthy
      skumodel-init-1:
        condition: service_completed_successfully
      skumodel-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: xben-092-sku-service
